[workspace]
resolver = "2"
members = [
    "crates/agoravote-core",
    "crates/agoravote-voting",
    "crates/agoravote-stats",
    "crates/agoravote-store",
    "crates/agoravote-auth",
    "crates/agoravote-api",
    "crates/agoravote-g1",
]
# `agoravote-g1` a rejoint le workspace principal en itération 8 (cf.
# docs/DEVLOG.md) : `agoravote-api` a besoin d'en dépendre par chemin
# pour câbler l'identité Ğ1v2 optionnelle (addendum v0.3), ce que Cargo
# refuse tant que ce crate déclare sa propre section `[workspace]`
# séparée ("multiple workspace roots found in the same workspace").
# La contrainte de toolchain qui avait motivé cette exclusion (rustc
# 1.75, cf. l'historique git de ce fichier) est levée depuis
# l'itération 6 : l'arbre de dépendances cryptographique compile
# désormais dans ce même `cargo build --workspace`.

# Métadonnées partagées par tous les crates du workspace.
# cf. cahier des charges §12 "Architecture technique cible" :
#   le noyau métier (core, voting, stats) est en Rust ; l'API expose
#   ce noyau au reste du système (web, CLI, etc.) via HTTP/JSON.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later" # à confirmer par la gouvernance du projet, cf. §17
authors = ["AgoraVote contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
