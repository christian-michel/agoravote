server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques (JS/CSS/polices) : noms de fichiers avec hash
    # de contenu (cf. Vite) — cache long, sûr par construction (un
    # changement de contenu change le nom de fichier).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Renvoie /api/* vers le service `api` du docker-compose — même
    # principe que le proxy Vite en développement (cf. vite.config.ts),
    # pour que le frontend n'ait jamais à connaître l'adresse réelle de
    # l'API ni à gérer de CORS.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toute route non-fichier renvoie index.html, pour que
    # React Router gère la navigation côté client (ex: recharger
    # directement /admin/campagnes/xxx doit fonctionner, pas 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
