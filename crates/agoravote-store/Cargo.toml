[package]
name = "agoravote-store"
description = "Persistance d'AgoraVote : backend mémoire (tests, MVP local) et backend PostgreSQL (cf. cahier des charges §12.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
agoravote-core = { path = "../agoravote-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing = "0.1"

# `query`/`query_as` (API à l'exécution) plutôt que les macros
# `query!`/`query_as!` (vérifiées à la compilation) : ces dernières
# exigent soit une base de données accessible pendant `cargo build`,
# soit un cache `.sqlx/` préparé à l'avance et tenu à jour à chaque
# changement de requête — un couplage que l'on juge disproportionné
# pour la taille actuelle du projet. Le prix payé : une erreur de nom
# de colonne ne serait détectée qu'au premier appel, pas à la
# compilation — compensé par les tests d'intégration de ce crate, qui
# exercent chaque requête contre une vraie base (cf. `tests/`).
#
# Version 0.6, pas encore 0.7/0.8 : rustc 1.94 (cf. Cargo.toml racine,
# section "Contexte d'origine important") lève la contrainte de
# toolchain qui empêchait de COMPILER sqlx 0.6 sans épinglages
# transitifs (voir plus bas — ces pins ont pu être supprimés), mais ne
# suffit pas à elle seule à justifier une migration vers 0.7/0.8 :
# l'API de macros/offline/executor a changé entre ces versions majeures,
# ce qui toucherait tout ce crate (déjà testé contre un vrai
# PostgreSQL) pour un gain non demandé ici. Migration proposée comme
# item de roadmap séparé (cf. docs/ROADMAP.md), pas faite dans cette
# itération.
sqlx = { version = "0.6", default-features = false, features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
    "offline",
] }

# Les épinglages transitifs précédemment nécessaires ici (`idna_adapter`,
# `native-tls`, `openssl`/`openssl-sys`, `unicode-segmentation`, `idna`,
# `url`, `crc`) sont retirés : ils ne servaient qu'à forcer des versions
# transitives compatibles avec le MSRV 1.75 de l'environnement de
# développement d'origine (cf. `docs/DEVLOG.md`, itération 2, et
# itération 6 pour la levée de cette contrainte). Avec rustc 1.94,
# `cargo build`/`cargo test` résolvent des versions plus récentes de
# ces dépendances sans intervention. Si un jour l'environnement de
# développement redescend sous rustc 1.80, réintroduire ces pins
# (versions exactes conservées dans l'historique git de ce fichier).

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
agoravote-auth = { path = "../agoravote-auth" }
