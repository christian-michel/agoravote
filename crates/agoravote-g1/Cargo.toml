[package]
name = "agoravote-g1"
description = "Module d'identité optionnel : preuve de possession de clé Ğ1v2 et vérification d'adhésion à la toile de confiance (cf. addendum v0.3 du cahier des charges)"
# Valeurs explicites plutôt que `.workspace = true` : ce crate est
# volontairement exclu du workspace racine (cf. Cargo.toml racine et
# `crates/agoravote-g1/README.md`), donc il ne peut pas hériter des
# clés `[workspace.package]` — Cargo refuserait de le construire même
# de façon autonome sinon ("current package believes it's in a
# workspace when it's not").
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["AgoraVote contributors"]

[workspace]
# Fait de ce crate la racine de SON PROPRE petit workspace à un seul
# membre, avec son propre `Cargo.lock` — indépendant de celui du
# projet principal. Sans cette section, Cargo remonterait
# l'arborescence de dossiers, trouverait le `[workspace]` racine
# d'AgoraVote, et refuserait de construire ce crate puisqu'il n'y est
# plus listé comme membre (cf. commentaire ci-dessus).

[dependencies]
agoravote-core = { path = "../agoravote-core" }
# Versions explicites (pas `.workspace = true`, cf. note ci-dessus sur
# l'exclusion de ce crate du workspace racine).
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# `subxt-signer` : uniquement la cryptographie (sr25519, encodage SS58),
# SANS le client réseau complet — c'est la brique qui permet de vérifier
# une signature hors ligne, testable sans connexion à un nœud. Le
# format de clé/signature sr25519 est celui utilisé par Substrate (donc
# par Duniter v2) et par les portefeuilles Ğ1 (Cesium², Ğecko).
#
# `optional = true`, activé par la feature `signature-verification`
# (voir plus bas) et non par défaut : cf. le long commentaire
# ci-dessous sur l'état de compilation de ce crate dans cet
# environnement. Grâce à cette feature, `cargo test -p agoravote-g1`
# (SANS argument de feature) compile et teste réellement `challenge.rs`
# aujourd'hui, dans CET environnement — seuls `signature.rs` et
# `chain.rs` restent non vérifiables ici.
subxt-signer = { version = "0.37", default-features = false, features = ["sr25519", "subxt"], optional = true }

# --- État de vérification de ce crate dans CET environnement ---
#
# Ni `subxt-signer` seul (vérification de signature, ci-dessus) ni
# `subxt` (requêtes réseau, ci-dessous) n'ont pu être compilés dans ce
# bac à sable de développement (rustc 1.75 via apt). Deux sessions de
# bisection ont été menées (même méthode que pour `sqlx`, cf.
# `crates/agoravote-store/Cargo.toml`) : la seconde a progressé bien
# plus loin que la première avant de buter sur un mur.
#
# Chaîne de blocages successifs identifiés et contournés, dans l'ordre
# où ils sont apparus (chacun un simple épinglage de version, comme
# pour `sqlx`) : constant_time_eq (0.4.2 puis 0.4.1 puis 0.4.0 exigent
# tous l'édition 2024 — seul 0.3.1 fonctionne) → indexmap (2.14.2) →
# zeroize/zeroize_derive (déjà épinglés ci-dessous) → toml_parser
# (1.0.4 exige rustc 1.76 ; 1.0.1 fonctionne) → parity-scale-codec
# (3.7.5 exige rustc 1.79 ; 3.6.12 fonctionne) → parity-scale-codec-derive
# (même correctif) → **blocage final, non résolu** : `toml_datetime
# v0.7.5+spec-1.1.0` exige rustc 1.76, réclamé par une dépendance non
# identifiée (le tracer avec `cargo tree` était impossible sans
# résolution réussie ; ni l'épinglage direct de `toml_datetime`, ni de
# `toml_edit`, ni de `toml`, ni de `rustc_version`/`proc-macro-crate`
# à des versions plus anciennes n'a permis de le contourner).
#
# Conséquence assumée et documentée en détail dans
# `docs/G1_INTEGRATION.md` et `crates/agoravote-g1/README.md` :
# **tout le code de ce crate — y compris la vérification de signature,
# la partie la plus simple — est écrit avec soin mais n'a été ni
# compilé ni testé dans cet environnement.** Il doit être compilé et
# vérifié dans un environnement à toolchain Rust à jour (l'image
# Docker de ce projet, par exemple — un `cargo build` avec un rustc
# 2026 récent n'aurait probablement aucun des problèmes ci-dessus,
# puisqu'ils sont tous des questions de MSRV/édition, pas de bugs)
# avant toute utilisation. C'est une exception au reste de ce projet,
# où chaque ligne livrée a été testée avant d'être présentée comme
# fonctionnelle — cf. `crates/agoravote-g1/README.md` pour le pourquoi
# de cette exception et la marche à suivre pour la lever.
subxt = { version = "0.37", default-features = false, features = ["jsonrpsee", "native"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Épinglages qui ont fait progresser la résolution (cf. paragraphe
# ci-dessus) — tous vérifiés nécessaires, aucun n'a suffi à terminer
# la résolution à lui seul.
# Épinglages qui ont fait progresser la résolution (cf. paragraphe
# ci-dessus) — tous vérifiés nécessaires, aucun n'a suffi à terminer
# la résolution à lui seul. `optional = true` + rattachés à la feature
# `signature-verification` ci-dessous : sans quoi Cargo tenterait de
# les résoudre même pour un `cargo build`/`cargo test` par défaut sans
# aucune feature activée, cassant la compilation de
# `challenge.rs`/`error.rs` qui n'en ont pourtant pas besoin — erreur
# réellement rencontrée pendant le développement, corrigée par ces
# `optional = true`.
zeroize = { version = "=1.7.0", optional = true }
zeroize_derive = { version = "=1.4.2", optional = true }
blake3 = { version = "=1.5.1", optional = true }
curve25519-dalek = { version = "=4.1.1", optional = true }
constant_time_eq = { version = "=0.3.1", optional = true }
indexmap = { version = "=2.6.0", optional = true }
toml_parser = { version = "=1.0.1", optional = true }
parity-scale-codec = { version = "=3.6.12", optional = true }
parity-scale-codec-derive = { version = "=3.6.12", optional = true }

[features]
default = []
# Active `signature.rs` (vérification sr25519). Activer uniquement
# dans un environnement avec une toolchain Rust à jour (voir
# ci-dessus) : `cargo build -p agoravote-g1 --features signature-verification`.
signature-verification = [
    "dep:subxt-signer",
    "dep:zeroize",
    "dep:zeroize_derive",
    "dep:blake3",
    "dep:curve25519-dalek",
    "dep:constant_time_eq",
    "dep:indexmap",
    "dep:toml_parser",
    "dep:parity-scale-codec",
    "dep:parity-scale-codec-derive",
]
# Active `chain.rs` (requêtes réseau vers un nœud Duniter v2). Activer
# uniquement dans un environnement avec une toolchain Rust à jour (voir
# ci-dessus) : `cargo build -p agoravote-g1 --features chain-query`.
chain-query = ["dep:subxt", "dep:tokio", "signature-verification"]
