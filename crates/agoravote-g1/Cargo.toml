[package]
name = "agoravote-g1"
description = "Module d'identité optionnel : preuve de possession de clé Ğ1v2 et vérification d'adhésion à la toile de confiance (cf. addendum v0.3 du cahier des charges)"
# Réintégré au workspace principal en itération 8 (cf. docs/DEVLOG.md) :
# la contrainte de toolchain qui imposait un `[workspace]` séparé (voir
# l'historique git de ce fichier) est levée depuis l'itération 6 — ce
# crate compile désormais dans le même `cargo build --workspace` que le
# reste du projet. Nécessaire pour que `agoravote-api` puisse en
# dépendre par chemin : Cargo refuse qu'un membre de workspace dépende
# d'un crate qui se déclare racine de SON PROPRE workspace séparé
# ("multiple workspace roots found in the same workspace").
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
agoravote-core = { path = "../agoravote-core" }
serde.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing = "0.1"
uuid.workspace = true

# `ed25519-zebra` (Zcash Foundation) : implémentation ed25519 pure,
# SANS aucune dépendance réseau — c'est la brique qui permet de
# vérifier une signature hors ligne, testable sans connexion à un
# nœud. **PAS `subxt-signer`** (utilisé par une version antérieure de
# ce module pour du sr25519) : cf. l'avertissement en tête de
# `signature.rs` — les comptes/portefeuilles Ğ1v2 réels (Cesium²,
# Ğecko) signent en ed25519, pas en sr25519 (schéma spécifique à
# l'écosystème Polkadot, sans bénéfice pour Duniter). `subxt-signer` ne
# propose d'ailleurs aucun module `ed25519` (vérifié en lisant son code
# source : seulement `sr25519`/`ecdsa`/`eth`), donc ce n'est de toute
# façon pas la bonne brique ici.
#
# Déjà présent dans l'arbre de dépendances résolu du workspace (tiré
# transitivement par `smoldot`, dépendance de `subxt` pour la feature
# `chain-query` ci-dessous) : ajouter cette dépendance directe ne
# introduit donc aucune nouvelle contrainte de version surprise.
#
# `optional = true`, activé par la feature `signature-verification`
# (voir plus bas) et non par défaut.
ed25519-zebra = { version = "4", optional = true }

# --- État de vérification de ce crate ---
#
# Historique (rustc 1.75, environnement de développement d'origine) :
# ni la cryptographie de signature (alors via `subxt-signer`) ni
# `subxt` (requêtes réseau, ci-dessous) ne compilaient alors. Deux
# sessions de bisection de dépendances avaient identifié la chaîne de
# blocages suivante, chacun résolu par un simple épinglage de version
# (même méthode que pour `sqlx`, cf. `crates/agoravote-store/Cargo.toml`) :
# constant_time_eq (0.4.x exige l'édition 2024 — seul 0.3.1 fonctionne)
# → indexmap → zeroize/zeroize_derive → toml_parser (1.0.4 exige rustc
# 1.76 ; 1.0.1 fonctionne) → parity-scale-codec (3.7.5 exige rustc 1.79 ;
# 3.6.12 fonctionne) → parity-scale-codec-derive (même correctif) →
# `toml_datetime` (exige rustc 1.76). Avec rustc 1.94 (itération 6,
# cf. docs/DEVLOG.md), tous ces épinglages ont suffi à compiler et
# tester l'intégralité du crate, `chain-query` compris — ils restent en
# place tels quels (versions exactes déjà vérifiées fonctionnelles,
# aucune raison de les faire bouger sans nécessité). Rattachés
# directement à `chain-query` (pas à `signature-verification`, cf.
# itération 9) depuis que `signature-verification` n'a plus besoin de
# `subxt`/`subxt-signer` du tout — seul `chain-query` en dépend encore.
#
# Ce qui reste non vérifié aujourd'hui n'est PAS un problème de
# compilation : c'est `chain.rs` (requêtes réseau vers un nœud Ğ1v2),
# jamais exécuté contre un vrai nœud faute d'accès réseau à
# l'infrastructure Duniter depuis un environnement de développement
# utilisé jusqu'ici (testé et confirmé bloqué à plusieurs reprises,
# cf. docs/G1_INTEGRATION.md) — feature `chain-query`, désactivée par
# défaut et non activée par `agoravote-api` (cf. son Cargo.toml).
subxt = { version = "0.37", default-features = false, features = ["jsonrpsee", "native"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Épinglages qui ont fait progresser la résolution de `subxt`
# (`chain-query`, cf. paragraphe ci-dessus) — tous vérifiés
# nécessaires, aucun n'a suffi à terminer la résolution à lui seul.
# `optional = true` + rattachés à la feature `chain-query` ci-dessous :
# sans quoi Cargo tenterait de les résoudre même pour un `cargo
# build`/`cargo test` par défaut sans aucune feature activée, cassant
# la compilation de `challenge.rs`/`error.rs` qui n'en ont pourtant pas
# besoin — erreur réellement rencontrée pendant le développement,
# corrigée par ces `optional = true`.
zeroize = { version = "=1.7.0", optional = true }
zeroize_derive = { version = "=1.4.2", optional = true }
blake3 = { version = "=1.5.1", optional = true }
curve25519-dalek = { version = "=4.1.1", optional = true }
constant_time_eq = { version = "=0.3.1", optional = true }
indexmap = { version = "=2.6.0", optional = true }
toml_parser = { version = "=1.0.1", optional = true }
parity-scale-codec = { version = "=3.6.12", optional = true }
parity-scale-codec-derive = { version = "=3.6.12", optional = true }

[features]
default = []
# Active `signature.rs` (vérification ed25519, cf. son avertissement
# en tête de fichier pour l'historique du correctif sr25519 -> ed25519).
# Activer uniquement dans un environnement avec une toolchain Rust à
# jour (voir ci-dessus) :
# `cargo build -p agoravote-g1 --features signature-verification`.
signature-verification = ["dep:ed25519-zebra"]
# Active `chain.rs` (requêtes réseau vers un nœud Duniter v2). Activer
# uniquement dans un environnement avec une toolchain Rust à jour (voir
# ci-dessus) : `cargo build -p agoravote-g1 --features chain-query`.
chain-query = [
    "dep:subxt",
    "dep:tokio",
    "dep:zeroize",
    "dep:zeroize_derive",
    "dep:blake3",
    "dep:curve25519-dalek",
    "dep:constant_time_eq",
    "dep:indexmap",
    "dep:toml_parser",
    "dep:parity-scale-codec",
    "dep:parity-scale-codec-derive",
    "signature-verification",
]
